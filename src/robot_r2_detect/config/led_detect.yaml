led_detect:
  ros__parameters:
    image_topic: /r2/left_camera/image_raw
    service_name: /r2/led_detection/detect
    # Published once per processed frame only while continuous detection is on.
    result_topic: /r2/led_detection/result
    visualization_topic: /r2/led_detection/debug
    visualization_enabled: false

    # When false, images are processed only while the service is active.
    # This parameter can be changed at runtime.
    continuous_detection: true

    aruco_dictionary: DICT_4X4_50
    # Set to -1 to accept the detected marker with the largest image area.
    target_marker_id: 4
    # Outer edge length of the ArUco marker.
    marker_size_mm: 100.0

    # LED positions are relative to the marker's top-left outer corner.
    # Request and response state arrays use this same index order.
    led_count: 1
    led_positions_x_mm: [0.0]
    led_positions_y_mm: [170.0]
    led_radius_mm: 10.0
    brightness_threshold: 200.0

    # Actual processing cap (not only a warning threshold). Incoming frames
    # above this rate are dropped before CameraFrame conversion and ArUco work.
    target_processing_rate: 5.0
