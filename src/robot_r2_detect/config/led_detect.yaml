led_detect:
  ros__parameters:
    # When enabled, keep the input subscription active and continuously publish
    # annotated debug images even when no detection service is running.
    visualization_enabled: false

    # Publish LedDetection results continuously instead of only tracking service
    # requests. Visualization can remain active independently of this switch.
    continuous_detection: false
    stable_match_frames: 5
    service_timeout_sec: 30.0

    aruco_dictionary: DICT_4X4_50
    # Set to -1 to accept the detected marker with the largest image area.
    target_marker_id: 4
    # Outer edge length of the ArUco marker.
    marker_size_mm: 100.0

    # LED positions are relative to the marker's top-left outer corner.
    # Request and response state arrays use this same index order.
    led_count: 1
    led_positions_x_mm: [0.0]
    led_positions_y_mm: [170.0]
    led_radius_mm: 10.0
    brightness_threshold: 200.0

    # Actual processing cap. Values above 15 Hz are rejected.
    target_processing_rate: 15.0
