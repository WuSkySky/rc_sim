kfs_detect:
  ros__parameters:
    feature_path: kfs_shape_templates.npz
    roi_topic: /r2/kfs/roi
    visualization_topic: /r2/detection/debug
    visualization_enabled: false
    conf: 0.5
    max_chamfer_distance: 0.015
    min_class_margin: 0.004
    vote_service_name: /r2/detection/get_type
    default_vote_timeout_sec: 10.0

    simulation_status_topic: /simulation/status
    robot_pose_topic: /r2/pose_feedback
    simulation_team: blue

    # Stage-two traversable cell centers and blue Meilin KFS cells.
    grid_x: [-2.6, -1.4, -0.2, 1.0, 2.2, 3.4]
    grid_y: [-4.2, -3.0, -1.8]
    meilin_x: [2.2, 1.0, -0.2, -1.4]
    grid_pitch: 1.2

    # Allows detection at the 0.2 m and 0.4 m loading edge poses.
    cell_snap_tolerance: 0.55
