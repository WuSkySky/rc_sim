/**:
  ros__parameters:
    # Empty selects model/resnet18_batch3_fp16.engine from the installed package.
    model_path: ""
    # TensorRT engines do not embed class labels or preprocessing metadata.
    # This order must match the engine output logits exactly.
    model_input_size: 224
    model_class_names: ["R1", "Unlabeled", "fake", "true"]
    model_mean: [0.485, 0.456, 0.406]
    model_std: [0.229, 0.224, 0.225]
    # Crop this fraction from both the left and right before inference.
    horizontal_crop_ratio: 0.2
    # Per-camera annotated debug images, each published on
    # /r2/detection/{front,left,right}/debug when its switch is enabled AND
    # the topic has subscribers. Independent and dynamic.
    visualization_enabled_front: false
    visualization_enabled_left: false
    visualization_enabled_right: false
    conf: 0.5
    # Warn when one frame takes longer than the 30 Hz camera period.
    target_processing_rate: 30.0
    # The fused C++ node runs at this maximum batch rate. It consumes the
    # newest frame from every available camera and never waits for a missing
    # camera. Frames older than the timeout are ignored.
    inference_rate: 30.0
    frame_stale_timeout_sec: 0.5
    default_vote_timeout_sec: 10.0

    simulation_team: blue

    # Stage-two traversable cell centers and blue Meilin KFS cells.
    grid_x: [-2.6, -1.4, -0.2, 1.0, 2.2, 3.4]
    grid_y: [-4.2, -3.0, -1.8]
    meilin_x: [2.2, 1.0, -0.2, -1.4]
    grid_pitch: 1.2

    # Allows detection at the 0.2 m and 0.4 m loading edge poses.
    cell_snap_tolerance: 0.55
