kfs_gripper_tip_rotate:
  ros__parameters:
    command_topic: /r2/gripper/tip_rotate_cmd
    feedback_topic: /r2/gripper/tip_rotate_feedback
    service_name: /r2/gripper/set_tip_rotate
    # Zero is the initial pose; negative values follow the working direction.
    min_position: -3.141592653589793
    max_position: 0.0
    default_tolerance: 0.01
    default_timeout_sec: 10.0
