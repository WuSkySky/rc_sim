aruco_detect:
  ros__parameters:
    # --- Marker identification ---
    # Set to -1 to accept all detected markers.
    target_marker_id: -1

    # --- ArUco configuration ---
    aruco_dictionary: DICT_4X4_50
    marker_size_mm: 100.0

    # --- ArUco detector parameters (tunable at runtime) ---
    # These are slightly more lenient than OpenCV defaults to work
    # with phone-screen markers and laptop webcams.
    adaptive_thresh_win_size_min: 3
    adaptive_thresh_win_size_max: 23
    adaptive_thresh_win_size_step: 10
    adaptive_thresh_constant: 7.0
    min_marker_perimeter_rate: 0.01
    max_marker_perimeter_rate: 4.0
    polygonal_approx_accuracy_rate: 0.05
    min_corner_distance_rate: 0.01
    min_marker_distance_rate: 0.01
    marker_border_bits: 1

    # --- Pose estimation ---
    publish_tf: true
    axis_length_mm: 50.0

    # --- Output ---
    visualization_enabled: true
    # Maximum image processing rate in Hz. Extra frames are dropped.
    # Set to 30 to match the USB camera frame rate.
    target_processing_rate: 30.0
