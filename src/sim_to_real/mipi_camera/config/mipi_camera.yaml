# Common parameters shared by all physical MIPI cameras.
/**:
  ros__parameters:
    # [width, height, framerate]. Supported modes:
    # [3280, 2464, 21], [3280, 1848, 28], [1920, 1080, 30], [1640, 1232, 30], [1280, 720, 60].
    mode: [1280, 720, 30]

    # NVIDIA nvvidconv flip method, 0 means no rotation or mirroring.
    flip_method: 0
    visualization_enabled: false

    # --- Camera intrinsics (pinhole model) ---
    # IMX219 sensor pixel size is ~1.12 um. Leave focal_length_mm and
    # pixel_size_um at 0.0 to fall back to f=max(width, height). Fill these
    # after calibrating the camera and lens for accurate pose estimation.
    focal_length_mm: 0.0
    pixel_size_um: 0.0
    # plumb_bob distortion coefficients from calibration. Zero (undistorted)
    # until the camera and lens are calibrated.
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0

# Weapon-tip camera on real2 (Jetson2), using the stable CSI-A/B alias.
tip_mipi_camera:
  ros__parameters:
    device: /dev/mipi_tip
    # nvvidconv: 2 = rotate 180 degrees. Camera mounted rotated 180 degrees.
    flip_method: 2
