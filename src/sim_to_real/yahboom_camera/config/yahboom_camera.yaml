# Yahboom USB UVC camera (Sunplus SDYH-8P0P, USB 1bcf:0b09).
/**:
  ros__parameters:
    # Video device node. Install udev/90-yahboom-camera.rules for a stable
    # /dev/yahboom_front alias, or use the by-id path under /dev/v4l/by-id/.
    device: /dev/video2

    # MJPG (Motion-JPEG, 30 fps at full HD) or YUYV (raw, lower framerate).
    pixel_format: MJPG

    # [width, height, framerate]. MJPG 30 fps modes: [1920, 1080, 30],
    # [1280, 720, 30], [800, 600, 30], [720, 1000, 30], [640, 480, 30],
    # [640, 360, 30], [600, 600, 30], [320, 240, 30].
    # 默认 720p：在 30 fps 下避免加重 kfs_roi / 融合检测的下游处理负载。
    mode: [1280, 720, 30]

    visualization_enabled: false

    # --- Camera intrinsics (pinhole model) ---
    # This UVC webcam has no datasheet calibration. Leave focal_length_mm and
    # pixel_size_um at 0.0 to fall back to f=max(width, height). Fill these
    # after calibrating the camera and lens for accurate pose estimation.
    focal_length_mm: 0.0
    pixel_size_um: 0.0
    # plumb_bob distortion coefficients from calibration. Zero (undistorted)
    # until the camera and lens are calibrated.
    k1: 0.0
    k2: 0.0
    p1: 0.0
    p2: 0.0
    k3: 0.0
