# Common parameters shared by both physical MIPI cameras.
/**:
  ros__parameters:
    # [width, height, framerate]. Supported modes:
    # [3280, 2464, 21], [3280, 1848, 28], [1920, 1080, 30], [1640, 1232, 30], [1280, 720, 60].
    mode: [1920, 1080, 30]

    # NVIDIA nvvidconv flip method, 0 means no rotation or mirroring.
    flip_method: 0

# Stable aliases bind each node to one physical Jetson MIPI connector.
left_camera_driver:
  ros__parameters:
    device: /dev/mipi_left
    frame_id: r2_left_camera_optical_frame

right_camera_driver:
  ros__parameters:
    device: /dev/mipi_right
    frame_id: r2_right_camera_optical_frame
