kfs_roi:
  ros__parameters:
    target_processing_rate: 30.0
    visualization_enabled: false

    blue_hsv_lower: [95, 60, 20]
    blue_hsv_upper: [135, 255, 255]
    red_low_hsv_lower: [0, 60, 20]
    red_low_hsv_upper: [15, 255, 255]
    red_high_hsv_lower: [165, 60, 20]
    red_high_hsv_upper: [179, 255, 255]
    column_threshold_ratio: 0.7
    morphology_kernel_size: 5
    min_mask_area_px: 100
    # Pixel offset added to the final KFS center (center_u and
    # center_offset_x) before publishing. Dynamic; positive shifts right.
    center_offset_px: 0
