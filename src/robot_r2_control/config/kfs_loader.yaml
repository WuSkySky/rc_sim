kfs_loader_control:
  ros__parameters:
    service_timeout_sec: 10.0

    # Each step contains:
    # root_position, tip_position, grip_position,
    # root_tolerance, tip_tolerance, grip_tolerance.
    # All three motors are commanded concurrently in every step.
    front_standard_sequence: [
      # Move to the front pickup pose with the gripper open.
      1.1471975511965977, -1.1471975511965977, 0.209, 0.01, 0.01, 0.005,
      # Grip the KFS.
      1.1471975511965977, -1.1471975511965977, 0.145, 0.01, 0.01, 0.005,
      # Return the tip first, then return the root.
      1.1471975511965977, -3.141592653589793, 0.145, 0.01, 0.01, 0.005,
      0.0, -3.141592653589793, 0.145, 0.01, 0.01, 0.005,
      # Release into the storage area.
      0.0, -3.141592653589793, 0.209, 0.01, 0.01, 0.005
    ]

    front_transfer_sequence: [
      1.1471975511965977, -1.1471975511965977, 0.209, 0.01, 0.01, 0.005,
      1.1471975511965977, -1.1471975511965977, 0.145, 0.01, 0.01, 0.005,
      # Return both rotation axes while keeping the KFS gripped.
      0.0, 0.0, 0.145, 0.01, 0.01, 0.005
    ]

    top_standard_sequence: [
      # Move to the top pickup pose with the gripper open.
      1.7395202484681462, -0.16872392167324968, 0.209, 0.01, 0.01, 0.005,
      # Grip the KFS.
      1.7395202484681462, -0.16872392167324968, 0.145, 0.01, 0.01, 0.005,
      # Return the root first, then return the tip.
      0.0, -0.16872392167324968, 0.145, 0.01, 0.01, 0.005,
      0.0, -3.141592653589793, 0.145, 0.01, 0.01, 0.005,
      # Release into the storage area.
      0.0, -3.141592653589793, 0.209, 0.01, 0.01, 0.005
    ]

    top_transfer_sequence: [
      1.7395202484681462, -0.16872392167324968, 0.209, 0.01, 0.01, 0.005,
      1.7395202484681462, -0.16872392167324968, 0.145, 0.01, 0.01, 0.005,
      # Return both rotation axes while keeping the KFS gripped.
      0.0, 0.0, 0.145, 0.01, 0.01, 0.005
    ]

    release_sequence: [
      # Move the gripped KFS to the release pose.
      0.7853981633974483, -0.7853981633974483, 0.145, 0.01, 0.01, 0.005,
      # Open the gripper, then return to the initial pose.
      0.7853981633974483, -0.7853981633974483, 0.209, 0.01, 0.01, 0.005,
      0.0, 0.0, 0.209, 0.01, 0.01, 0.005
    ]

    pop_sequence: [
      # Keep both rotation axes at zero, then pulse the gripper closed/open.
      0.0, 0.0, 0.0, 0.01, 0.01, 0.005,
      0.0, 0.0, 0.209, 0.01, 0.01, 0.005
    ]
