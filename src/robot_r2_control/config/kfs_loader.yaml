/kfs_loader_control:
  ros__parameters:
    service_timeout_sec: 10.0

    # Each step contains:
    # root_position, tip_position, grip_position,
    # root_tolerance, tip_tolerance, grip_tolerance.
    # All three motors are commanded concurrently in every step.
    # Mode 1: front load, current loaded count 0, store onboard.
    mode_1_sequence: [
      1.192, -1.228, 0.046, 0.01, 0.01, 0.02,
      1.192, -1.228, 0.0, 0.01, 0.01, 0.02,
      0.23, -2.916, 0.0, 0.01, 0.01, 0.02,
      0.0, -2.916, 0.0, 0.01, 0.01, 0.02,
      0.0, -2.916, 0.046, 0.01, 0.01, 0.02,
    ]

    # Mode 2: front load, current loaded count 2, keep gripped.
    mode_2_sequence: [
      1.192, -1.228, 0.046, 0.01, 0.01, 0.02,
      1.192, -1.228, 0.0, 0.01, 0.01, 0.02,
      0.0, -1.562, 0.0, 0.01, 0.01, 0.02,
    ]

    # Mode 3: top load, current loaded count 0, store onboard.
    mode_3_sequence: [
      1.53, 0.0, 0.046, 0.01, 0.01, 0.02,
      1.53, 0.0, 0.0, 0.01, 0.01, 0.02,
      0.2, -2.5, 0.0, 0.01, 0.01, 0.02,
      0.129, -2.889, 0.0, 0.01, 0.01, 0.02,
      0.129, -2.889, 0.046, 0.01, 0.01, 0.02,
    ]

    # Mode 4: top load, current loaded count 2, keep gripped.
    mode_4_sequence: [
      1.53, 0.0, 0.046, 0.01, 0.01, 0.02,
      1.53, 0.0, 0.0, 0.01, 0.01, 0.02,
      0.284, -1.761, 0.0, 0.01, 0.01, 0.02,
    ]

    # Mode 5: top load, current loaded count 1.
    mode_5_sequence: [
      1.53, 0.0, 0.046, 0.01, 0.01, 0.02,
      1.53, 0.0, 0.0, 0.01, 0.01, 0.02,
      0.264, -2.366, 0.0, 0.01, 0.01, 0.02,
      0.264, -2.366, 0.046, 0.01, 0.01, 0.02,
      0.0, -1.688, 0.046, 0.01, 0.01, 0.02,
    ]

    release_sequence: [
      1.334, -1.46, 0.0, 0.01, 0.01, 0.02,
      1.334, -1.46, 0.046, 0.01, 0.01, 0.02,
    ]

    pop_sequence: [
      # Keep both rotation axes at zero, then pulse the gripper closed/open.
      0.0, 0.0, 0.0, 0.01, 0.01, 0.005,
      0.0, 0.0, 0.209, 0.01, 0.01, 0.005
    ]
