/step_traverse:
  ros__parameters:
    dependency_timeout_sec: 2.0
    move_timeout_sec: 35.0
    lift_timeout_sec: 15.0

    a1: 0.1
    a1_backoff: 0.015
    a2: 0.48
    a2_backoff: 0.015
    a3: 0.38
    up_pre_lift_clearance: 0.05
    b1: 0.22
    b2: 0.44
    b3: 0.16

    lift_all_front: 0.21
    lift_all_rear: 0.20
    lift_front_only_front: 0.20
    # 不抬升侧保持 0.01 m 离地间隙，避免机构贴地。
    lift_front_only_rear: 0.01
    lift_rear_only_front: 0.01
    lift_rear_only_rear: 0.20
    lift_down_front: 0.01
    lift_down_rear: 0.01
