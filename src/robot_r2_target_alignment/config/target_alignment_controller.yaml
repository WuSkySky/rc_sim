/**:
  ros__parameters:
    # Safe default: all inference and PID calculations run, but cmd_vel is silent.
    test_mode: true

    control:
      enabled: true
      rate_hz: 20.0
      pixel_tolerance: 20
      stable_frames: 8
      lost_timeout_sec: 0.3

      # PID input is horizontal error normalized by half the image width.
      kp: 0.6
      ki: 0.0
      kd: 0.05
      integral_limit: 1.0
      output_limit: 0.4
      minimum_output: 0.04

      # Rear-facing camera convention: target right of image center ->
      # move the chassis to its right, i.e. publish negative linear.y.
      invert_output: false

    log:
      rate_hz: 2.0
