/**:
  ros__parameters:
    # CameraFrame input video topic. Supports runtime subscription switching.
    input_video_topic: /r2/right_camera/image_raw

    model:
      # FP16 TensorRT engine exported on the target Jetson for 640x640 input.
      path: package://robot_r2_detect/model/duantou_fp16.engine
      input_size: 640
      # TensorRT CUDA device index.
      device: "0"

    inference:
      confidence: 0.5
      iou: 0.7
      max_detections: 20
      rate_hz: 60.0

    target:
      # Comma-separated values. Empty filters accept all model classes.
      # When both are set, a detection must match both filters.
      class_names: ""
      class_ids: ""
      # center selects the detection closest to the image center (alignment
      # point). confidence retains the previous confidence-first behavior.
      selection_mode: center
      max_track_distance_ratio: 0.2
      switch_confidence_margin: 0.15

    visualization:
      enabled: false
